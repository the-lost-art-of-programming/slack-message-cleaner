[advisories]
unmaintained = "all"
maximum-db-staleness = "P30D"
# RUSTSEC-2024-0436 is a maintenance notice, not an exploitable vulnerability.
# The Leptos dependency tree currently requires paste. Revisit during upgrades.
ignore = [
  { id = "RUSTSEC-2024-0436", reason = "Transitive Leptos maintenance-only notice; remove when framework upgrades" },
]

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Unlicense",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
