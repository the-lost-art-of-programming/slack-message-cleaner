[package]
name = "cleaner-ui"
description = "Firefox sidebar implemented in Rust and Leptos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
live-delete = []

[dependencies]
cleaner-core = { version = "0.1.0", path = "../cleaner-core" }
leptos = { version = "0.8.22", features = ["csr"] }
wasm-bindgen = "0.2.105"
wasm-bindgen-futures = "0.4.55"
js-sys = "0.3.82"
web-sys = { version = "0.3.82", features = ["Window", "HtmlInputElement", "HtmlSelectElement", "UrlSearchParams"] }
serde = { workspace = true }
serde_json = "1.0.145"
gloo-net = "0.6.0"
gloo-timers = { version = "0.3.0", features = ["futures"] }

[lints]
workspace = true
