name: Extension build and headless Firefox smoke
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  firefox:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Rust and WASM target
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt
          rustup target add wasm32-unknown-unknown --toolchain 1.96.0
      - name: Verify extension safety invariants
        run: python3 scripts/static_check.py
      - name: Compile and package Firefox extension
        run: |
          cargo install --locked trunk
          cargo check -p cleaner-ui --target wasm32-unknown-unknown
          python3 scripts/build.py
      - name: Install Firefox
        uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795
        with:
          firefox-version: latest-esr
      - name: Install headless test dependencies
        run: python3 -m pip install --break-system-packages 'selenium==4.36.0'
      - name: Headless Firefox install and WASM UI smoke
        run: python3 scripts/firefox_smoke.py
      - name: Store non-destructive Firefox preview package
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: firefox-preview-${{ github.sha }}
          path: own-message-cleaner-firefox.zip
          retention-days: 7
