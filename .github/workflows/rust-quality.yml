name: Rust quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust:
    name: Unit, integration, lint, and Rustdoc
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Rust toolchains
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt
          rustup toolchain install nightly --profile minimal --component rustfmt
      - name: Enforce consistent formatting
        run: cargo +nightly fmt --all -- --check
      - name: Compile core and run strict Clippy
        run: |
          cargo check -p cleaner-core --all-targets
          cargo clippy -p cleaner-core --all-targets -- -D warnings
      - name: Unit and black-box integration tests
        run: cargo test -p cleaner-core --all-targets -- --test-threads=2
      - name: Executable Rustdoc and documentation lint
        run: |
          cargo test -p cleaner-core --doc
          RUSTDOCFLAGS='-D warnings' cargo doc -p cleaner-core --no-deps
      - name: Offline security and structural checks
        run: python3 scripts/static_check.py
  dependencies:
    name: Advisory, license and source audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Resolve dependencies
        run: cargo generate-lockfile
      - name: Enforce cargo-deny policies
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
        with:
          command: check
          arguments: advisories bans licenses sources
