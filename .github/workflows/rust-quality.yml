# Host Rust core CI; browser and Slack integration remain blocked test gates.
name: Rust quality
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust and nightly rustfmt
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt
          rustup toolchain install nightly --profile minimal --component rustfmt
      - name: Check and test native Rust core
        run: |
          cargo check -p cleaner-core
          cargo clippy -p cleaner-core --all-targets -- -D warnings
          cargo +nightly fmt --all -- --check
          cargo test -p cleaner-core
      # Add pinned cargo-audit, cargo-deny, llvm-cov and cargo-mutants jobs once
      # the first crate and dependency graph have been established.
      # Add a separate wasm32-unknown-unknown build and real Firefox integration
      # job; host tests alone cannot validate browser integration.
